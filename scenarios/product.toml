[[scenario]]
id = "sbm-core-x86_64"
description = "Boot the real SBM menu into a real SBM Core UKI, then check the kernel, the management service, and the GParted smoke marker. Skipped until the UKI exists."
tier = "product"
profile = "sbm-uefi-x86_64"
network = "user"
use_core = true
timeout_secs = 600
send_key = "c"
send_key_after = "menu_ready"
stop_on_serial = ["SBM_SMOKE_DONE"]
screenshot = "qmp"
expect = ["menu_ready", "key c"]
serial_contains = ["Linux version", "SBM_UI_READY", "SBM_SMOKE_DONE"]

[[scenario]]
id = "sbm-core-x86_64-offline"
description = "The Core recovery path with no NIC. Skipped until the UKI exists."
tier = "product"
profile = "sbm-uefi-x86_64"
network = "none"
use_core = true
timeout_secs = 600
send_key = "c"
send_key_after = "menu_ready"
stop_on_serial = ["SBM_SMOKE_DONE"]
expect = ["menu_ready", "key c"]
serial_contains = ["Linux version", "SBM_UI_READY", "SBM_SMOKE_DONE"]

[[scenario]]
id = "sbm-core-aarch64-offline"
description = "aarch64 Core recovery with no NIC. Skipped until the UKI exists. A 64 MiB scratch disk is attached for GParted and is not a host disk."
tier = "product"
profile = "sbm-uefi-aarch64"
network = "none"
use_core = true
timeout_secs = 900
send_key = "c"
send_key_after = "menu_ready"
stop_on_serial = ["SBM_SMOKE_DONE"]
expect = ["menu_ready", "key c"]
serial_contains = ["Linux version", "SBM_UI_READY", "SBM_SMOKE_DONE"]
