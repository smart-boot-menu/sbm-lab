[[scenario]]
id = "sbm-uefi-menu-x86_64"
description = "Boot the real SBM menu, capture the GOP frame, press C for recovery, and reset back to the menu. The recovery payload is the labeled SBM fixture, not a Linux distribution."
tier = "product"
profile = "sbm-uefi-x86_64"
timeout_secs = 180
send_key = "c"
send_key_after = "menu_ready"
stop_on_expect = true
reset_after = "chainload_returned"
screenshot = "qmp"
expect = ["menu_ready", "key c", "fixture_started", "chainload_returned", "target SBM Core Slot A"]
require_files = ["EFI/sbm/handoff/current.json", "EFI/sbm/state/last_attempt.json", "EFI/sbm/test/chainload-ok.txt"]

[[scenario]]
id = "sbm-uefi-menu-x86_64-online"
description = "Same menu and recovery path with user networking. Remote boot selection stays off in policy.json."
tier = "product"
profile = "sbm-uefi-x86_64"
network = "user"
timeout_secs = 180
send_key = "c"
send_key_after = "menu_ready"
stop_on_expect = true
screenshot = "qmp"
expect = ["menu_ready", "key c", "fixture_started", "chainload_returned", "remote"]
require_files = ["EFI/sbm/test/chainload-ok.txt"]

[[scenario]]
id = "sbm-uefi-menu-aarch64"
