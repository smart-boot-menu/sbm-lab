[workspace]

[package]
name = "efi-probe"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
uefi = { version = "0.41", features = ["panic_handler", "alloc", "global_allocator"] }

[profile.release]
panic = "abort"
lto = false
opt-level = "s"

[[bin]]
name = "efi-probe"
path = "src/main.rs"

[[bin]]
name = "efi-payload"
path = "src/payload.rs"
