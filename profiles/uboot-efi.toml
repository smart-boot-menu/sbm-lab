id = "uboot-efi"
description = "U-Boot qemu_arm64 with CONFIG_EFI_LOADER, then the lab probe."
arch = "aarch64"
machine = "virt"
memory_mib = 1024
cpus = 2
accel = "tcg"
network = "none"
disks = ["multi-efi"]
notes = "QEMU 11.1.3 HVF aborts in hvf_handle_exception on this host, so this profile uses TCG. Requires var/firmware/u-boot-qemu-arm64.bin from sbm-lab setup --uboot."
