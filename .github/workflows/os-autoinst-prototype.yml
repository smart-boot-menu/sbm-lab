name: os-autoinst Prototype (Linux KVM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "prototypes/os-autoinst/**"
      - ".github/workflows/os-autoinst-prototype.yml"
  pull_request:
    paths:
      - "prototypes/os-autoinst/**"
      - ".github/workflows/os-autoinst-prototype.yml"

permissions:
  contents: read

jobs:
  isotovideo-uefi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi

      - name: Install OVMF and disk-image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ovmf dosfstools mtools fdisk
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build minimal x86_64 UEFI probe
        run: |
          cargo build --manifest-path fixtures/efi-probe/Cargo.toml --release \
            --target x86_64-unknown-uefi

      - name: Assemble 48 MiB GPT + FAT32 probe disk image
        run: |
          mkdir -p pool/assets
          IMG="${PWD}/pool/assets/probe-disk.raw"
          ESP="${PWD}/pool/assets/esp.fat"
          truncate -s 48M "$ESP"
          mkfs.vfat -F 32 -n SBMLAB "$ESP"
          mmd -i "$ESP" ::/EFI ::/EFI/BOOT
          mcopy -i "$ESP" \
            fixtures/efi-probe/target/x86_64-unknown-uefi/release/efi-probe.efi \
            ::/EFI/BOOT/BOOTX64.EFI
          truncate -s 50M "$IMG"
          printf 'label: gpt\nstart=2048, size=98304, type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B, name="ESP"\n' \
            | sfdisk "$IMG"
          dd if="$ESP" of="$IMG" bs=512 seek=2048 conv=notrunc status=none
          rm -f "$ESP"

      - name: Prepare vars.json and run isotovideo
        run: |
          OVMF_CODE="$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -n 1)"
          OVMF_VARS="$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -n 1)"
          test -n "$OVMF_CODE" && test -n "$OVMF_VARS"
          cp "$OVMF_VARS" pool/assets/OVMF_VARS.fd

          EXTRA_ARGS=()
          KVM_ARGS=()
          if [ -e /dev/kvm ]; then
            KVM_ARGS=(--device /dev/kvm)
            CPU_MODEL="host"
          else
            EXTRA_ARGS+=(qemu_no_kvm=1)
            CPU_MODEL="qemu64"
          fi

          python3 - "$OVMF_CODE" "$CPU_MODEL" <<'PY' > pool/vars.json
          import json, sys
          print(json.dumps({
              "BACKEND": "qemu",
              "ARCH": "x86_64",
              "CASEDIR": "/tests",
              "PRODUCTDIR": "/tests",
              "HDD_1": "/pool/assets/probe-disk.raw",
              "UEFI": 1,
              "UEFI_PFLASH_CODE": sys.argv[1],
              "UEFI_PFLASH_VARS": "/pool/assets/OVMF_VARS.fd",
              "QEMUCPU": sys.argv[2],
              "QEMUCPUS": 2,
              "QEMURAM": 512,
              "NICTYPE": "none",
              "SERIALDEV": "ttyS0",
              "HDDSIZEGB": 1,
          }, indent=2))
          PY

          docker run --rm \
            "${KVM_ARGS[@]}" \
            -v "${PWD}/prototypes/os-autoinst:/tests:ro" \
            -v "${PWD}/pool:/pool" \
            -v "/usr/share/OVMF:/usr/share/OVMF:ro" \
            -w /pool \
            registry.opensuse.org/devel/openqa/containers/isotovideo:qemu-kvm \
            --exit-status-from-test-results \
            "${EXTRA_ARGS[@]}"

      - name: Upload os-autoinst logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-autoinst-prototype-results
          path: |
            pool/autoinst-log.txt
            pool/serial0
            pool/testresults/
