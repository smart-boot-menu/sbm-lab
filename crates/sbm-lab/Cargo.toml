[package]
name = "sbm-lab"
description = "Virtual hardware laboratory for Smart Boot Menu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sbm-lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
fatfs = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
proptest = "1"
